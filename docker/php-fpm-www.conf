; Overrides the FPM pool so PHP-FPM:
;  - listens on TCP 127.0.0.1:9000 (matched by nginx fastcgi_pass)
;  - explicitly runs as www-data
;  - does NOT clear environment variables (clear_env = no). Laravel reads its
;    configuration from the environment variables injected by Render, so they
;    must be passed through to the FPM workers.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
