; Production OPcache settings for Laravel.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; CLI upload limits (matched to nginx client_max_body_size and the
; Savo receipt scan limit of 8 MB).
upload_max_filesize = 20M
post_max_size = 20M

; Keep FPM workers from timing out on long-running work.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
