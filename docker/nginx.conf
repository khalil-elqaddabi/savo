# Nginx server block for the Laravel/Savo app.
# PHP-FPM runs on TCP 127.0.0.1:9000 (see php-fpm-www.conf).
# PORT is injected by Render and substituted via envsubst in entrypoint.sh.
server {
    listen 0.0.0.0:${PORT};

    root /var/www/html/public;
    index index.php;

    server_name _;

    charset utf-8;
    client_max_body_size 20M;

    # Laravel/Savo receipt uploads allow up to 8 MB; keep a comfortable margin.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
